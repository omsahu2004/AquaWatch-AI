<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaWatch AI — Spatio-Temporal Water Quality Monitoring</title>
    <meta name="description" content="AI-driven decision support system for spatio-temporal water quality monitoring using aquatic drones across multiple geographical locations.">
    <meta name="keywords" content="water quality, aquatic drones, AI monitoring, WQI, water sensor">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-bg-effect"></div>
        <div class="loading-content">
            <div class="loading-logo">
                <div class="loading-logo-icon">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 32 Q12 20 18 28 Q24 36 30 20 Q36 8 42 16" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <circle cx="24" cy="24" r="20" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
                        <circle cx="24" cy="24" r="4" fill="#00d4ff" opacity="0.8"/>
                    </svg>
                </div>
                <div class="loading-logo-text">
                    <span class="loading-title">AquaWatch</span>
                    <span class="loading-subtitle">AI</span>
                </div>
            </div>
            <div class="loading-tagline">Spatio-Temporal Water Quality Monitoring</div>
            <div class="loading-bar-container">
                <div class="loading-bar">
                    <div class="loading-bar-fill" id="loading-bar-fill"></div>
                </div>
            </div>
            <p class="loading-status" id="loading-status">Initializing drone network...</p>
            <div class="loading-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- App Shell -->
    <div id="app" class="app-shell" style="display:none;">

        <!-- Background Ambient Effects -->
        <div class="ambient-bg">
            <div class="ambient-orb ambient-orb-1"></div>
            <div class="ambient-orb ambient-orb-2"></div>
        </div>

        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <svg viewBox="0 0 36 36" fill="none">
                            <path d="M4 24 Q9 14 14 20 Q19 26 24 14 Q29 4 32 10" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                            <circle cx="18" cy="18" r="15" stroke="#00d4ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
                            <circle cx="18" cy="18" r="3" fill="#00d4ff"/>
                        </svg>
                    </div>
                    <div class="sidebar-logo-text">
                        <span class="logo-name">AquaWatch</span>
                        <span class="logo-badge">AI</span>
                    </div>
                </div>
                <button class="sidebar-collapse-btn" id="sidebar-toggle" title="Collapse sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
            </div>

            <div class="nav-section">
                <span class="nav-section-label">Monitor</span>
                <ul class="nav-list">
                    <li>
                        <a href="#dashboard" class="nav-item active" data-page="dashboard" id="nav-dashboard">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                            </span>
                            <span class="nav-label-text">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="#map" class="nav-item" data-page="map" id="nav-map">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
                            </span>
                            <span class="nav-label-text">Live Map</span>
                        </a>
                    </li>
                    <li>
                        <a href="#analytics" class="nav-item" data-page="analytics" id="nav-analytics">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                            </span>
                            <span class="nav-label-text">Analytics</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="nav-section">
                <span class="nav-section-label">Intelligence</span>
                <ul class="nav-list">
                    <li>
                        <a href="#ai-support" class="nav-item" data-page="ai-support" id="nav-ai-support">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/></svg>
                            </span>
                            <span class="nav-label-text">AI Support</span>
                        </a>
                    </li>
                    <li>
                        <a href="#alerts" class="nav-item" data-page="alerts" id="nav-alerts">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                            </span>
                            <span class="nav-label-text">Alerts</span>
                            <span class="nav-badge" id="alert-badge" style="display:none;">0</span>
                        </a>
                    </li>
                    <li>
                        <a href="#reports" class="nav-item" data-page="reports" id="nav-reports">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                            </span>
                            <span class="nav-label-text">Reports</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="nav-section nav-section-bottom">
                <ul class="nav-list">
                    <li>
                        <a href="#settings" class="nav-item" data-page="settings" id="nav-settings">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            </span>
                            <span class="nav-label-text">Settings</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="sidebar-footer">
                <div class="sim-status-row">
                    <div class="sim-pulse-dot"></div>
                    <span class="sim-status-text">Simulation Live</span>
                </div>
                <div class="drone-count-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <span>5 Drones Active</span>
                </div>
            </div>
        </nav>

        <!-- Main Wrapper -->
        <div class="main-wrapper" id="main-wrapper">

            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="mobile-menu-btn" title="Toggle menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="breadcrumb" id="breadcrumb">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                        <span id="breadcrumb-text">Dashboard</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-clock" id="header-clock">00:00:00</div>
                    <div class="header-refresh-indicator">
                        <div class="refresh-pulse"></div>
                        <span id="last-updated">Syncing...</span>
                    </div>
                    <button class="theme-toggle-btn" id="theme-toggle" title="Toggle theme">
                        <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </button>
                    <div class="header-user">
                        <div class="user-avatar">AW</div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="page-content" id="page-content">
                <!-- Pages are rendered here dynamically by app.js -->
            </main>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- App Modules (order matters!) -->
    <script src="js/store.js"></script>
    <script src="js/ai-engine.js"></script>
    <script src="js/simulation.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/map.js"></script>
    <script src="js/pages/analytics.js"></script>
    <script src="js/pages/ai-support.js"></script>
    <script src="js/pages/alerts.js"></script>
    <script src="js/pages/reports.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
